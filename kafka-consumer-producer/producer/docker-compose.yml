version: '3.8'

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"  # 같은 docker network 안 컨테이너(이후 spark에서 사용)가 접근할 때 사용
    environment:
      # 단일 브로커
      KAFKA_NODE_ID: 1
      # 여기서 controller가 ZooKeeper의 역할을 대체
      KAFKA_PROCESS_ROLES: broker,controller
      # 리스너를 용도별로 분리
      # 1.host -> 모든 네트워크 인터페이스의 9092 포트에서 HOST라는 이름의 통신을 수신
      # 2.controller -> KRaft 모드에서 메타데이터 관리를 담당하는 컨트롤러 통신을 위함 : 주로 부로커의 상태보고 목적
      # 3.docker -> 도커 내부 네트워크의 다른 컨테이너들이 접근할 수 있도록 열어둔 29092 포트
      # [리스너이름]://[IP]:[포트] 형식으로서 IP는 0.0.0.0 이 생략된 형태
      KAFKA_LISTENERS: HOST://:9092,CONTROLLER://:9093,DOCKER://:29092
      # 외부에서 이 브로커를 접근할 때 사용할 주소와 포트. controller는 외부가 아니므로 설정은 불필요
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://host.docker.internal:29092
      # 브로커들간의 통신 목적으로는 HOST사용 -> 주로 복제 상황에서 상호 호출
      KAFKA_INTER_BROKER_LISTENER_NAME: HOST
      # 메타데이터 관리 및 쿼럼 통신(브로커 상태 관리 등)을 위한 컨트롤러 리스너 지정
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # 세 리스너 모두 암호화나 인증을 거치지 않는 일반 평문 통신인 PLAINTEXT를 사용하도록 지정
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      # 자동 토픽 생성 허용 : 기본값 true
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # 새 토픽 생성 시 기본 복제수. 단일 브로커이므로 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # 토픽당 파티션 기본값은 1개 -> 파티션은 추후 변경이 어려우므로 여유있게 세팅하길 권장
      # 브로커의 모든 토픽에 대한 설정으로, 토픽마다 크기를 다르게 하려면 cli를 통해 토픽생성
      KAFKA_NUM_PARTITIONS: 4
      # 메시지 보관 7일 : 별도의 설정이 없어도 default 7일
      KAFKA_LOG_RETENTION_HOURS: 168
    restart: unless-stopped
